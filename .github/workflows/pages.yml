# Deploy the static site to GitHub Pages on every push to main.
# Prerequisite (one-time, in the repo UI): Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions" (instead of "Deploy from a branch").
# The site then always equals merged main. The test suite runs before deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the test suite before deploying
        run: node --test tests/node/suite.test.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the whole repo as the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
